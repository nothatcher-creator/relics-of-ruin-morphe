name: Build and publish Morphe bundle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build Morphe Android bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --no-daemon

      - name: Collect MPP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          test -n "$MPP"
          cp "$MPP" dist/relics-of-ruin-0.1.3.mpp

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: relics-of-ruin-0.1.3
          path: dist/relics-of-ruin-0.1.3.mpp

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.3 >/dev/null 2>&1; then
            gh release upload v0.1.3 dist/relics-of-ruin-0.1.3.mpp --clobber
          else
            gh release create v0.1.3 dist/relics-of-ruin-0.1.3.mpp \
              --title "Relics of Ruin 0.1.3" \
              --notes "Diagnostic no-op patch. It intentionally injects nothing, to test whether a Morphe-rebuilt Terraria 1.4.5.8.5 APK launches at all."
          fi
