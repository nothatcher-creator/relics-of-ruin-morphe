name: Build and publish Morphe bundle

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build Morphe Android bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --no-daemon

      - name: Collect MPP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          test -n "$MPP"
          cp "$MPP" dist/relics-of-ruin-0.1.1.mpp
          ls -lah dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: relics-of-ruin-0.1.1
          path: dist/relics-of-ruin-0.1.1.mpp

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 dist/relics-of-ruin-0.1.1.mpp --clobber
          else
            gh release create v0.1.1 dist/relics-of-ruin-0.1.1.mpp \
              --title "Relics of Ruin 0.1.1" \
              --notes "Fix Stage 1 bootstrap hook for Terraria Android 1.4.5.8.5: target executable onCreate wrapper instead of native onCreate."
          fi

      - name: Update Morphe source manifest
        shell: bash
        run: |
          cat > patches-bundle.json <<'JSON'
          {
            "created_at": "2026-10-06T23:05:00Z",
            "description": "Relics of Ruin Stage 1 bootstrap fix for Terraria Android 1.4.5.8.5",
            "download_url": "https://github.com/nothatcher-creator/relics-of-ruin-morphe/releases/download/v0.1.1/relics-of-ruin-0.1.1.mpp",
            "signature_download_url": null,
            "version": "0.1.1"
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Morphe patch bundle manifest"
            git push
          fi
